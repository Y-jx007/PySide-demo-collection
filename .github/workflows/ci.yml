name: CI

on:
  push:
  pull_request:

jobs:
  static:
    name: syntax + generated registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile all Python files
        run: python -m compileall -q main.py launcher_widgets.py app_runner.py apps_manifest.py manifest_edit.py apps common support tests tools
      - name: Check generated layout and matrix
        run: python tools/sync_registry.py --check
      - name: Manifest tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_manifest.py" -v

  windows:
    name: Windows offscreen UI + full tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      # CI runner 没有 GPU：只 smoke 不依赖 GL/CUDA 的应用；
      # 完整 41 应用 smoke 在本地用 RUN_WINDOW_SMOKE=1 跑。
      RUN_WINDOW_SMOKE: "cpu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check generated layout and matrix
        run: python tools/sync_registry.py --check
      - name: UI structure checks
        run: |
          python tools/check_ui_style.py apps/Math/Quasicrystal.py
          python tools/check_ui_style.py apps/Physics/Mass-Spring.py
          python tools/check_ui_style.py "apps/Cellular Automata/Particle Lenia.py"
          python tools/check_ui_style.py "apps/Cellular Automata/Distill.py"
          python tools/check_ui_style.py apps/Unpolished/MPM2D.py
      - name: Full tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-output.log -Pattern '^(FAIL|ERROR):' | ForEach-Object {
              Write-Host "::error::$($_.Line)"
            }
            exit $code
          }
