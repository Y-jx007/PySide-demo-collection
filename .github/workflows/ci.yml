name: CI

on:
  push:
  pull_request:

jobs:
  static:
    name: syntax + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q main.py app_runner.py apps_manifest.py manifest_edit.py apps common support tests
      - name: Manifest tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_manifest.py" -v

  smoke:
    name: import smoke test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 taichi-forge==0.4.1 numpy pillow matplotlib PyOpenGL numba mpmath scipy cplot sounddevice
      - name: Run tests
        run: python -m unittest discover -s tests -v
